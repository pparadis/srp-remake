<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>srp-remake</title>
  </head>
  <body data-screen="home">
    <section id="screen-home" data-screen="home" class="screen">
      <div class="card">
        <h1>Street Racing Prototype</h1>
        <p id="homeNotice" class="notice" data-testid="home-notice" hidden></p>
        <label class="field">
          <span>Your name</span>
          <input id="homeName" data-testid="home-name" type="text" value="Player" maxlength="24" />
        </label>
        <button id="homeQuickBtn" data-testid="home-quick" type="button" class="primary">
          Quick race vs bots
        </button>
        <button id="homeCreateBtn" data-testid="home-create" type="button">
          Create online lobby
        </button>
        <div class="row">
          <input
            id="homeJoinCode"
            data-testid="home-join-code"
            type="text"
            placeholder="Lobby code"
            aria-label="Lobby code"
          />
          <button id="homeJoinBtn" data-testid="home-join" type="button">Join lobby</button>
        </div>
      </div>
    </section>

    <section id="screen-lobby" data-screen="lobby" class="screen">
      <div class="card">
        <h1 id="lobbyTitle" data-testid="lobby-title">Lobby</h1>
        <p id="lobbyNote" class="notice" data-testid="lobby-note" hidden></p>
        <div id="lobbyPlayersBlock">
          <h2>Players</h2>
          <ul id="lobbyPlayers" data-testid="lobby-players"></ul>
        </div>
        <h2>Settings</h2>
        <div class="row">
          <label class="field" id="lobbyHumansField">
            <span>Humans</span>
            <select id="lobbyHumans" data-testid="lobby-humans">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
            </select>
          </label>
          <label class="field">
            <span>Bots</span>
            <select id="lobbyBots" data-testid="lobby-bots">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </label>
          <label class="field">
            <span>Laps</span>
            <input
              id="lobbyLaps"
              data-testid="lobby-laps"
              type="number"
              min="1"
              max="999"
              step="1"
              value="5"
            />
          </label>
          <label class="field" id="lobbyTurnTimerField">
            <span>Turn timer</span>
            <select id="lobbyTurnTimer" data-testid="lobby-turn-timer">
              <option value="0">Off</option>
              <option value="30">30 s</option>
              <option value="60" selected>60 s</option>
              <option value="120">2 min</option>
            </select>
          </label>
        </div>
        <div id="lobbyInviteBlock">
          <h2>Invite link</h2>
          <div class="row">
            <input id="lobbyInviteLink" data-testid="lobby-invite-link" type="text" readonly />
            <button id="lobbyCopyBtn" data-testid="lobby-copy" type="button">Copy</button>
          </div>
        </div>
        <div class="row">
          <button id="lobbyStartBtn" data-testid="lobby-start" type="button" class="primary">
            Start race
          </button>
          <button
            id="lobbyPlayAgainBtn"
            data-testid="lobby-play-again"
            type="button"
            class="primary"
            hidden
          >
            Play again
          </button>
          <button id="lobbyLeaveBtn" data-testid="lobby-leave" type="button">Leave</button>
        </div>
      </div>
    </section>

    <section id="screen-race" data-screen="race" class="screen">
      <div id="app" data-testid="race-canvas"></div>
      <div id="hud" data-testid="hud"></div>
      <div id="results" data-testid="results" hidden>
        <div class="card">
          <h1>Race finished</h1>
          <p id="resultsWinner" data-testid="results-winner"></p>
          <table class="hud-standings" data-testid="results-standings">
            <thead>
              <tr>
                <th>#</th>
                <th></th>
                <th>Car</th>
                <th>Lap</th>
                <th>Gap</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <p id="resultsWait" data-testid="results-wait" hidden>
            Waiting for host to start another race
          </p>
          <div class="row">
            <button
              id="resultsLobbyBtn"
              data-testid="results-back-lobby"
              type="button"
              class="primary"
            >
              Back to lobby
            </button>
            <button
              id="resultsPlayAgainBtn"
              data-testid="results-play-again"
              type="button"
              class="primary"
              hidden
            >
              Play again
            </button>
            <button id="resultsHomeBtn" data-testid="results-home" type="button">Home</button>
          </div>
        </div>
      </div>
    </section>

    <div
      id="connectionBanner"
      class="connection-banner"
      data-testid="connection-banner"
      role="status"
      hidden
    ></div>
    <div id="statusLine" data-testid="status-line">ready</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
