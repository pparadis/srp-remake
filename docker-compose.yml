services:
  api:
    image: localhost/srp-remake-api:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
      HOST: 0.0.0.0
      PORT: 3001
      CORS_ALLOWED_ORIGINS: "*"
      PLAYER_TOKEN_TTL_SECONDS: 86400
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
