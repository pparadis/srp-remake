services:
  # Throwaway dev database (#206); the same major version as Neon's. Bound to localhost only.
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: srp
      POSTGRES_PASSWORD: srp
      POSTGRES_DB: srp
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U srp -d srp']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: localhost/srp-remake-api:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
      HOST: 0.0.0.0
      PORT: 3001
      CORS_ALLOWED_ORIGINS: '*'
      PLAYER_TOKEN_TTL_SECONDS: 86400
      DATABASE_URL: postgres://srp:srp@postgres:5432/srp
    depends_on:
      - postgres
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  pgdata:
