services:
  api:
    image: localhost/srp-remake-api:dev
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      CORS_ALLOWED_ORIGINS: "*"
      PLAYER_TOKEN_TTL_SECONDS: 86400
      ADMIN_DEBUG_ENABLED: "true"
    ports:
      - "3001:3001"
