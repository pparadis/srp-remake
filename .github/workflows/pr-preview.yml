name: PR Preview

# Builds the PR and publishes it to <pages>/pr-preview/pr-N/ on the gh-pages branch (#96), comments the link, and
# removes the folder when the PR closes. Same-repo PRs only: a fork's token cannot push.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Dependabot's token is read-only, so it could not publish a page anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build
        if: github.event.action != 'closed'
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
          VITE_PREVIEW_PR: ${{ github.event.number }}
          VITE_BACKEND_API_BASE_URL: https://srp-remake.onrender.com
        run: npm run build

      - name: Deploy or remove the preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: ./dist
