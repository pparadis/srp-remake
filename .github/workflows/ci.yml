name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Install Backend
        run: npm --prefix backend ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test Coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Backend Test
        run: npm run backend:test
      - name: Backend Build
        run: npm run backend:build
      # Render builds this image from the repo root and copies only some folders, so a new backend import outside them
      # passes backend:build above and fails there.
      - name: Backend Docker image
        run: docker build -f backend/Dockerfile .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # WebGL is what ships (#232) and runs the whole suite in 2 shards; the Canvas fallback gets a few
        # rendering-heavy specs only.
        include:
          - { renderer: webgl, args: '--shard=1/2' }
          - { renderer: webgl, args: '--shard=2/2' }
          - { renderer: canvas, args: 'e2e/smoke.spec.ts e2e/track.spec.ts e2e/glide.spec.ts' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Install Backend
        run: npm --prefix backend ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Skips the download when the cached browser is there; the system deps (apt) are never cached.
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e -- ${{ matrix.args }}
        env:
          E2E_RENDERER: ${{ matrix.renderer }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
