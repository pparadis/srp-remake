name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Postgres for the race store tests (#206); production is Neon.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: srp
          POSTGRES_PASSWORD: srp
          POSTGRES_DB: srp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U srp -d srp" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://srp:srp@127.0.0.1:5432/srp
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Install Backend
        run: npm --prefix backend ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test Coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Backend Test
        run: npm run backend:test
      - name: Backend Build
        run: npm run backend:build
      # Render builds this image from the repo root and copies only some folders, so a new backend import outside them
      # passes backend:build above and fails there.
      - name: Backend Docker image
        run: docker build -f backend/Dockerfile .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Install Backend
        run: npm --prefix backend ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Skips the download when the cached browser is there; the system deps (apt) are never cached.
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e -- --shard=${{ matrix.shard }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
