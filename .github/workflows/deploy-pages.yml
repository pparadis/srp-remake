name: Deploy Pages

# Production goes to the root of the gh-pages branch; PR previews live in pr-preview/ on the same branch (#96, see
# pr-preview.yml), so this deploy must keep that folder. The repo's Pages source is "Deploy from a branch: gh-pages".
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        env:
          GIT_SHA: ${{ github.sha }}
          VITE_BACKEND_API_BASE_URL: https://srp-remake.onrender.com
        run: npm run build

      # Pages would otherwise run Jekyll over the branch.
      - name: No Jekyll
        run: touch dist/.nojekyll

      - name: Deploy to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean-exclude: pr-preview/
