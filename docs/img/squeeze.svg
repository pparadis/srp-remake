<text x="60" y="136" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">Boxed in: a car in your lane and one in the next, just ahead</text>
<text x="60" y="154" fill="#8fa3b5" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">No normal target exists, so the engine offers cells beyond the cars. Each free cell shows its price.</text>
