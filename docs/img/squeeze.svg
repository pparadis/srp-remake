<rect x="0" y="0" width="840" height="538" fill="#0b0f14"/>
<text x="40" y="44" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">Squeeze: driving through cars when boxed in</text>
<text x="40" y="70" fill="#8fa3b5" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">Only when no normal target exists: +2 move points per car passed.</text>
<text x="40" y="88" fill="#8fa3b5" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">Main lanes only, at most one lane change, and a later zone than yours.</text>
