<text x="1102" y="490" fill="#5fd38a" font-size="18" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">= 5</text>
<text x="800" y="548" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">Why the surcharge is dropped</text>
<text x="800" y="570" fill="#8fa3b5" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">computeMoveSpend adds the first change's +1</text>
<text x="800" y="588" fill="#8fa3b5" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">only when the forward gain is at least the</text>
<text x="800" y="606" fill="#8fa3b5" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">cells walked. Here the gain is 2 and 4 cells</text>
<text x="800" y="624" fill="#8fa3b5" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">are walked, so no surcharge, although step 4</text>
<text x="800" y="642" fill="#8fa3b5" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">is a diagonal that needs one. The two sideways</text>
<text x="800" y="660" fill="#8fa3b5" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">cells pay for steps 1 and 2 only.</text>
<text x="800" y="690" fill="#ff9f43" font-size="11" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">Not a shortcut: 2 forward cells still cost 4 points.</text>
