<text x="1059.5" y="228" fill="#fff" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">+1</text>
<text x="1102" y="230" fill="#5fd38a" font-size="18" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">= 5</text>
